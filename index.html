<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OverRIPE</title>
  <meta name="description" content="OverRIPE is an independent research initiative of cybersecurity, infrastructure and threat intelligence professionals, focused on the hosting providers, infrastructure operators and online services that facilitate cybercrime, fraud and online abuse.">
  <meta name="theme-color" content="#0b121c">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Sampled from the logo */
      --navy-deep: #0b121c;
      --navy: #152233;
      --cream: #f4ecdf;
      --muted: #8d96a5;
      --blush: #ef897b;
      --logo-red: #a3160c;    /* "over": the logo's own red (apple and original lettering) */
      --logo-cream: #f4ecdf;  /* "RIPE", reversed from navy */
      --logo-speck-red: #f27164;    /* speckles in "over" */
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 48px 16px;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--cream);
      background-color: var(--navy-deep);
      background-image: radial-gradient(ellipse 80% 55% at 50% 45%, var(--navy), transparent 75%);
      text-align: center;
    }

    main { width: 100%; max-width: 760px; }

    h1 { margin: 0; }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.45));
    }

    .statement {
      max-width: 22em;
      margin: clamp(32px, 6vh, 56px) auto 0;
      font-size: clamp(1.15rem, 2.6vw, 1.5rem);
      font-weight: 600;
      line-height: 1.45;
      text-wrap: balance;
    }

    .contact {
      display: inline-block;
      margin-top: clamp(28px, 5vh, 44px);
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .contact:hover { color: var(--blush); border-color: currentColor; }

    .contact:focus-visible {
      outline: 2px solid var(--blush);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .contact { transition: none; }
    }
  </style>
</head>
